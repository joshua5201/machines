#cloud-config
# render.py injects per-VM user, SSH public key and password hash.
timezone: Asia/Taipei
ssh_pwauth: false
disable_root: true
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
package_update: true
package_upgrade: false
packages:
  - qemu-guest-agent
  - openssh-server
  - sudo
  - git
  - curl
  - ca-certificates
  - python3
  - python3-venv
  - python3-pip
  - build-essential
  - jq
  - unzip
  - rsync
write_files:
  - path: /etc/ssh/sshd_config.d/00-agent-auth.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      PubkeyAuthentication yes
runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  - [systemctl, restart, ssh]
  - [systemctl, set-default, multi-user.target]
  - [systemctl, enable, --now, serial-getty@ttyS0.service]
  # Install only: enroll interactively after cloud-init, never embed auth keys.
  - [curl, -fsSL, --retry, '3', --connect-timeout, '20', --max-time, '180', https://tailscale.com/install.sh, -o, /run/install-tailscale.sh]
  - [sh, /run/install-tailscale.sh]
  - [systemctl, enable, --now, tailscaled]
